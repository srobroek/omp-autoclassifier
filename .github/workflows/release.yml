name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR up to date from the Conventional Commits on main. Merging
  # that PR is what tags the release and triggers publishing below.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing: npm exchanges this OIDC token for a
      # short-lived credential, so no long-lived NPM_TOKEN exists anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm performs the publish, so it needs a Node toolchain new enough for
      # OIDC trusted publishing (npm >= 11.5.1, shipped with Node >= 22.14).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      # The tag is already cut, so this is the last chance to catch a bad release.
      - name: Verify the tagged tree
        run: bun run verify

      - name: Publish to npm with provenance
        run: npm publish --access public
        # Deliberately no NODE_AUTH_TOKEN: trusted publishing uses the OIDC token
        # above. Setting one would silently take precedence and publish without
        # provenance.
