name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun test

      # Proves the unit tests are load-bearing: each mutation breaks one behavior and the test that
      # owns it must fail. A surviving mutation is a test gap.
      - name: Mutation tests
        run: bun run test:mutate
